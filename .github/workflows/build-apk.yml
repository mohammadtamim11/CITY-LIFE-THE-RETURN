name: Build CITY LIFE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q CITY_LIFE_THE_RETURN_Android_Project.zip -d project

      - name: Build APK
        working-directory: project/CITY_LIFE_THE_RETURN_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CITY-LIFE-THE-RETURN-APK
          path: project/CITY_LIFE_THE_RETURN_Android/app/build/outputs/apk/debug/app-debug.apk
